<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한글 → Oracle SQL 생성기</title>
<style>
  :root {
    --bg: #18181b;
    --surface: #1f1f23;
    --surface-2: #27272a;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --text-faint: #71717a;
    --accent: #14b8a6;
    --accent-hover: #0d9488;
    --accent-fg: #042f2a;
    --warn: #fbbf24;
    --warn-bg: rgba(251, 191, 36, 0.1);
    --radius: 10px;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 20px 64px;
  }

  header { margin-bottom: 32px; }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }

  .sub {
    color: var(--text-muted);
    font-size: 0.9375rem;
    margin: 0;
    max-width: 60ch;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: var(--accent);
    background: rgba(20, 184, 166, 0.1);
    border: 1px solid rgba(20, 184, 166, 0.25);
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }

  .badge svg { width: 14px; height: 14px; }

  label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    min-height: 96px;
    resize: vertical;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-family: var(--sans);
    font-size: 1rem;
    line-height: 1.6;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }

  textarea::placeholder { color: var(--text-faint); }

  textarea:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.25);
  }

  .actions {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  button {
    font-family: var(--sans);
    font-size: 0.9375rem;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 150ms ease, color 150ms ease, opacity 150ms ease;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-fg);
    border: 1px solid transparent;
    padding: 9px 18px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .btn-primary svg { width: 16px; height: 16px; }

  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border-strong);
    padding: 9px 14px;
  }
  .btn-ghost:hover { color: var(--text); background: var(--surface-2); }

  .result { margin-top: 32px; }

  .result-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .result-head .label-inline {
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-muted);
  }

  .copy-btn {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 5px 11px;
    font-size: 0.8125rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .copy-btn svg { width: 14px; height: 14px; }

  pre {
    margin: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 0.875rem;
    line-height: 1.7;
    color: var(--text);
    white-space: pre;
    tab-size: 2;
  }

  pre.empty { color: var(--text-faint); }

  .warnings {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .warning {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    background: var(--warn-bg);
    border: 1px solid rgba(251, 191, 36, 0.25);
    border-radius: 8px;
    padding: 10px 13px;
    font-size: 0.875rem;
    color: #fcd34d;
  }
  .warning svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }

  .examples { margin-top: 40px; }
  .examples h2 {
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 12px;
  }

  .example-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
  }

  .example-list li + li { border-top: 1px solid var(--border); }

  .example-btn {
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 11px 4px;
    font-size: 0.9375rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .example-btn:hover { color: var(--text); }
  .example-btn svg { width: 15px; height: 15px; color: var(--accent); flex-shrink: 0; }

  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--text-faint);
    font-size: 0.8125rem;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.875rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (min-width: 640px) {
    body { font-size: 15px; }
    h1 { font-size: 1.625rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
        Oracle 11g
      </span>
      <h1>한글 → Oracle SQL 생성기</h1>
      <p class="sub">원하는 조회 조건을 한글로 적으면 Oracle 11g 문법에 맞는 SELECT 문을 만들어 줍니다. 인터넷·API 없이 브라우저에서 바로 동작합니다.</p>
    </header>

    <label for="input">한글 문장</label>
    <textarea id="input" placeholder="예) 환자 테이블에서 이름이 김으로 시작하는 사람 조회"></textarea>

    <div class="actions">
      <button class="btn-primary" id="run">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        SQL 생성
      </button>
      <button class="btn-ghost" id="clear">지우기</button>
    </div>

    <div class="result">
      <div class="result-head">
        <span class="label-inline">생성된 SQL</span>
        <button class="copy-btn" id="copy" aria-label="SQL 복사">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          복사
        </button>
      </div>
      <pre id="output" class="empty">여기에 SQL이 표시됩니다.</pre>
      <div class="warnings" id="warnings"></div>
    </div>

    <section class="examples">
      <h2>예시 (클릭하면 입력됩니다)</h2>
      <ul class="example-list" role="list" id="examples"></ul>
    </section>

    <footer>
      규칙 기반 변환기 · 조회(SELECT) 전용 · 생성된 SQL은 실제 컬럼명과 대조 후 사용하세요.
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">복사되었습니다</div>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
